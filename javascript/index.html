<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan 1 Javascript</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
        }
        button{
            padding: 10px 16px;
            cursor: pointer;
        }
        #tips{
            background-color: #f0f5f0f4;
            padding: 15px;
            margin-top: 16px;
            border-left: 4px #0f6a4a solid;
        }

    </style>
</head>
<body>
    <h1>Customer Registration Form</h1>
    <p>Latihan menggunakan javascript</p>

    <button id="toggleButton" type="button">Tampilkan petunjuk</button>
    <div id="tips" hidden>
        <strong>Petunujuk pengisian</strong>
        <p>Isi nama lengkap dan email dengan benar sebelum mengirim formulir.</p>
    </div>
    <script>
        console.log("javascript berhasil dimuat");

        const toggleButton=document.querySelector("#toggleButton");
        const tips=document.querySelector("#tips");

        //Aler("Test");
        toggleButton.addEventListener("click",function(){
            tips.hidden = !tips.hidden;

            console.log("Tombol di klick");
        });

    </script>
        
</body>
</html>
